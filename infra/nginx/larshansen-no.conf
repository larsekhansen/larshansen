# larshansen.no is just another address for larshansen.dev: send everything there.
# Cloudflare Tunnel forwards larshansen.no and www.larshansen.no to http://localhost:8090.
#
# Install: copy to /etc/nginx/sites-available/, symlink into sites-enabled,
# then `sudo nginx -t && sudo systemctl reload nginx`.

server {
    listen 127.0.0.1:8090;
    server_name larshansen.no www.larshansen.no;
    return 301 https://larshansen.dev$request_uri;
}
