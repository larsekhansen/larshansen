<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Jernhaugen · Lars Hansen</title>
    <meta
      name="description"
      content="A small maze game: steer a viking through a cursed burial mound without touching the walls. Seven levels, a few snakes, a crumbling floor and a raven with opinions."
    />
    <meta name="theme-color" content="#fffcf6" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lars Hansen" />
    <meta property="og:url" content="https://maze.larshansen.dev/" />
    <meta property="og:title" content="Jernhaugen · Lars Hansen" />
    <meta property="og:description" content="Steer through the cursed mound. Don't touch the walls." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <header class="bar">
      <h1 class="me">Lars Hansen</h1>
      <nav class="apps" aria-label="Destinations">
        <ul>
          <li><a href="https://larshansen.dev/viking/?from=maze" id="back">Vikingfjorden</a></li>
          <li class="far"><a href="https://larshansen.dev/">Gamle Oslo</a></li>
        </ul>
      </nav>
      <!-- The level: filled in by the game, so it stays hidden without JavaScript. -->
      <div class="run" id="run" hidden>
        <span class="name" id="name"></span>
        <button type="button" class="level" id="level" aria-haspopup="dialog"></button>
        <p class="clock"><span id="clock">0:00.0</span><small id="best"></small></p>
        <span class="deaths" id="deaths"></span>
        <button type="button" id="mute" class="tool" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" /><path class="waves" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" /><path class="cross" d="M16 9l5 6m0-6-5 6" /></svg>
        </button>
      </div>
    </header>

    <main class="stage" id="stage">
      <p class="sr-only" id="blurb" data-i18n="blurb">Steer through the cursed mound without touching the walls.</p>
      <canvas id="px" aria-hidden="true"></canvas>
      <canvas id="ui" aria-hidden="true"></canvas>
      <p class="help" id="help" data-i18n="help">Mouse, finger or arrow keys to steer, Shift for small steps, Esc to leave.</p>
      <p class="sr-only" id="announce" aria-live="polite"></p>
      <div class="card" id="finish" role="status" hidden>
        <strong id="finish-title"></strong>
        <p id="finish-line"></p>
        <div class="marks-row" id="finish-marks"></div>
        <p class="marks-total" id="finish-total"></p>
        <span class="actions">
          <a href="https://larshansen.dev/viking/?from=maze" class="primary" id="finish-link"></a>
        </span>
      </div>
      <noscript>
        <p class="noscript">
          Jernhaugen trenger JavaScript, men lenkene over fungerer uten.<br />
          Jernhaugen needs JavaScript, but the links above work without it.
        </p>
      </noscript>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
