name: Deploy to Raspberry Pi

# Builds the monorepo on a self-hosted runner that lives ON the Pi (outbound-only,
# so it works behind the home double-NAT — no inbound ports needed) and publishes
# each app's static build to the nginx webroots that Cloudflare Tunnel serves.
#
# Prerequisite: the Pi must be registered as a self-hosted runner with the label
# `larshansen-pi`, and own the /var/www/* webroots. See infra/README.md.

on:
  push:
    branches: [master, main] # works on the current default and survives a master→main rename
  workflow_dispatch:

concurrency:
  group: deploy-pi
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, larshansen-pi]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # The version this Pi runs; a new Bun can change the build, so it is moved on purpose.
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test the games
        # The kit, the maze, the front page and Vikingfjorden (the scripted players, the reach and
        # dead-end searches, the level measure). About 80 s on the Pi, nearly all of it the viking
        # suite's searches; a red test stops the deploy before anything is published.
        run: |
          set -euo pipefail
          for dir in packages/pixelkit packages/maze apps/landing apps/viking; do
            echo "== $dir"
            (cd "$dir" && bun test)
          done

      - name: Build all apps
        run: bun run build

      - name: Publish to nginx webroots
        run: |
          set -euo pipefail
          # Built files in assets/ have hashed names, and a page cached in a browser may still ask for
          # the previous ones. So --delete leaves old assets alone, and they are removed after 30 days.
          publish () {
            local app=$1 webroot=$2; shift 2
            rsync -a --delete --filter 'P /assets/**' "$@" "apps/$app/dist/" "$webroot/"
            if [ -d "$webroot/assets" ]; then find "$webroot/assets" -type f -mtime +30 -delete; fi
          }
          # apps/qr and apps/viking live inside larshansen.dev at /qr/ and /viking/, so the landing
          # page's --delete must leave them alone.
          publish landing   /var/www/larshansen.dev --exclude /qr/ --exclude /viking/
          publish qr        /var/www/larshansen.dev/qr
          publish viking    /var/www/larshansen.dev/viking
          publish portfolio /var/www/cv.larshansen.dev
          publish iron-maze /var/www/maze.larshansen.dev

      - name: Smoke test through nginx
        run: |
          set -euo pipefail
          # Ask nginx on the Pi directly, the same way the Cloudflare Tunnel does.
          fetch () { curl -fsS --max-time 10 -H "Host: larshansen.dev" "http://127.0.0.1:8090$1"; }
          expect () {
            local body; body=$(fetch "$1") # read it all first; `curl | grep -q` can fail on SIGPIPE
            if grep -qF "$2" <<<"$body"; then echo "ok   $1"; else echo "FAIL $1 does not contain: $2"; exit 1; fi
          }

          # The front page lists its apps as plain links; the game reads them.
          expect /     'data-door="qr"'
          expect /qr/  'QR-verkstedet'
          # The game behind the Opera's secret door, and its script from /viking/assets/.
          expect /viking/ 'Vikingfjorden'
          script=$(fetch /viking/ | grep -o '/viking/assets/index-[^"]*\.js')
          expect "$script" 'Langkaia'
          # The chunks the first script loads on demand: a level (Nordmarka) and the maze's scene.
          # A missing or misnamed chunk would otherwise only show in a browser.
          body=$(fetch "$script")
          level=$(grep -o 'nordmarka-[A-Za-z0-9_-]*\.js' <<<"$body" | head -n 1)
          maze=$(grep -o 'scene-[A-Za-z0-9_-]*\.js' <<<"$body" | head -n 1)
          for chunk in "$level" "$maze"; do
            if [ -z "$chunk" ]; then echo "FAIL a lazy chunk is not named in $script"; exit 1; fi
            fetch "/viking/assets/$chunk" > /dev/null && echo "ok   /viking/assets/$chunk"
          done
          # The QR app's script must load from /qr/assets/, not the landing page's /assets/.
          expect "$(fetch /qr/ | grep -o '/qr/assets/index-[^"]*\.js')" 'Lest av QR-leser'

          # The maze answers on its own host name, with the same scene that Vikingfjorden loads.
          maze=$(curl -fsS --max-time 10 -H "Host: maze.larshansen.dev" "http://127.0.0.1:8090/")
          if grep -qF 'Jernhaugen' <<<"$maze"; then echo "ok   maze.larshansen.dev /"; else echo "FAIL maze.larshansen.dev / does not contain: Jernhaugen"; exit 1; fi
