name: Deploy to Raspberry Pi

# Builds the monorepo on a self-hosted runner that lives ON the Pi (outbound-only,
# so it works behind the home double-NAT — no inbound ports needed) and publishes
# each app's static build to the nginx webroots that Cloudflare Tunnel serves.
#
# Prerequisite: the Pi must be registered as a self-hosted runner with the label
# `larshansen-pi`, and own the /var/www/* webroots. See infra/README.md.

on:
  push:
    branches: [master, main] # works on the current default and survives a master→main rename
  workflow_dispatch:

concurrency:
  group: deploy-pi
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, larshansen-pi]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all apps
        run: bun run build

      - name: Publish to nginx webroots
        run: |
          set -euo pipefail
          publish () { local app=$1 webroot=$2; shift 2; rsync -a --delete "$@" "apps/$app/dist/" "$webroot/"; }
          # apps/qr lives inside larshansen.dev at /qr/, so the landing page's --delete must leave it alone.
          publish landing   /var/www/larshansen.dev --exclude /qr/
          publish qr        /var/www/larshansen.dev/qr
          publish portfolio /var/www/cv.larshansen.dev
          publish iron-maze /var/www/maze.larshansen.dev

      - name: Smoke test through nginx
        run: |
          set -euo pipefail
          # Ask nginx on the Pi directly, the same way the Cloudflare Tunnel does.
          fetch () { curl -fsS --max-time 10 -H "Host: larshansen.dev" "http://127.0.0.1:8090$1"; }
          expect () {
            local body; body=$(fetch "$1") # read it all first; `curl | grep -q` can fail on SIGPIPE
            if grep -qF "$2" <<<"$body"; then echo "ok   $1"; else echo "FAIL $1 does not contain: $2"; exit 1; fi
          }

          expect /     '<div id="root">'
          expect /qr/  'QR-verkstedet'
          # The QR app's script must load from /qr/assets/, not the landing page's /assets/.
          expect "$(fetch /qr/ | grep -o '/qr/assets/index-[^"]*\.js')" 'Lest av QR-leser'
